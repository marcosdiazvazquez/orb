# XcodeGen spec: `xcodegen` turns this into Orb.xcodeproj (which is not committed).
name: Orb
options:
  bundleIdPrefix: com.nathanielcblack
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    # Set your Apple ID team here (or in Xcode's Signing & Capabilities) to run on a phone.
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
packages:
  PanoCore:
    path: Packages/PanoCore
targets:
  Orb:
    type: application
    platform: iOS
    sources:
      - Orb
    dependencies:
      - package: PanoCore
    info:
      path: Orb/Info.plist
      properties:
        CFBundleDisplayName: Orb
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Orb takes the photos that it stitches into 360° panoramas.
        NSPhotoLibraryAddUsageDescription: Orb saves your 360° panoramas to Photos.
        NSLocationWhenInUseUsageDescription: Orb tags each panorama with where it was taken.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64, gyroscope, still-camera, metal]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanielcblack.orb
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Orb:
    build:
      targets:
        Orb: all
    # The stitcher is pixel loops: a Debug (-Onone) build is ~20x slower, so Run uses Release.
    run:
      config: Release
    archive:
      config: Release
